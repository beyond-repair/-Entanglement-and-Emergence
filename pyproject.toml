[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entanglement-emergence"
version = "0.1.0"
description = "Claim-0 1D spin-chain toy for Entanglement-and-Emergence essay"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy==2.2.4",
  "matplotlib==3.10.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
entanglement-emergence = "entanglement_emergence.demo:main"

[tool.setuptools.packages.find]
include = ["entanglement_emergence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
